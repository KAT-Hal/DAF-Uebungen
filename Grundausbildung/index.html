<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grundausbildung – Richtig oder falsch?</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#1d3027;background:#f2f5f0}body{margin:0}.wrap{max-width:850px;margin:28px auto;padding:0 16px}header{background:#344f3c;color:white;padding:25px;border-radius:16px}h1{margin:0 0 9px;font-size:1.8rem}header p{margin:0;line-height:1.5}.card{background:white;border:1px solid #d8e1d6;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 5px #00000008}.num{font-weight:bold;color:#52705b;margin-bottom:8px}.statement{font-size:1.1rem;line-height:1.5;margin:0 0 15px}.choices{display:flex;gap:12px;flex-wrap:wrap}button{cursor:pointer;font:inherit;border-radius:9px;padding:11px 20px;border:2px solid #a6b7a9;background:white;color:#1d3027}button:hover:not(:disabled){background:#e7eee8}button.selected{background:#344f3c;color:white;border-color:#344f3c}button:disabled{cursor:default;opacity:.9}.feedback{margin-top:14px;padding:12px;border-radius:9px;line-height:1.45}.correct{background:#e0f2e4;color:#174d27}.incorrect{background:#fff0df;color:#78451c}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0 40px}.primary{background:#344f3c;color:white;border-color:#344f3c}.result{font-size:1.15rem;font-weight:bold;padding:16px;background:#e3eee4;border-radius:12px}small{color:#546b59}</style></head><body><main class="wrap"><header><h1>Grundausbildung bei der Bundeswehr</h1><p>Richtig oder falsch? Lies die Aussagen und entscheide. Du bekommst nach jeder Antwort sofort eine Rückmeldung.</p></header><div id="questions"></div><div class="actions"><div id="result" class="result" aria-live="polite">Noch keine Antwort abgegeben.</div><button class="primary" id="restart">Übung wiederholen</button></div><small>Interaktive Leseverstehensübung · 20 Aussagen</small></main><script>
const items=[
["Die Soldaten mussten jeden Morgen schon um 20 vor 5 aufstehen.",true,"20 vor 5 bedeutet 4.40 Uhr."],
["Nach dem Aufstehen hatten die Soldaten zuerst Frühstück.",false,"Nach dem Aufstehen mussten sie gleich Sport treiben."],
["In der ersten Woche übten die Soldaten Liegestütze und Klimmzüge.",false,"Sie übten Liegestütze und Rumpfbeugen."],
["Bei der Stubenkontrolle wurden die Uniformen kontrolliert.",false,"Im Text geht es um die Ordnung in der Stube, die Betten und die Schränke."],
["Die Soldaten mussten ihre Betten machen und ihre Schränke aufräumen.",true,"Auch das Säubern der Stube gehörte dazu."],
["In der Formalausbildung lernten die Soldaten das Marschieren und Salutieren.",true,"Beides wurde in der Formalausbildung geübt."],
["Einmal in der Woche gab es theoretischen Unterricht.",false,"Die Soldaten hatten jeden Tag theoretischen Unterricht."],
["Der Erzähler interessiert sich für Militärgeschichte.",true,"Der Unterricht in Militärgeschichte machte ihm Spaß; er interessiert sich allgemein für Geschichte."],
["Wehr- und Soldatenrecht fand der Erzähler besonders spannend.",false,"Er fand dieses Fach etwas trocken, aber wichtig."],
["Im Fach Wehr- und Soldatenrecht lernten die Soldaten ihre Rechte und Pflichten kennen.",true,"Das war ein wichtiges Thema dieses Faches."],
["In der Ersten Hilfe lernten die Soldaten, wie man Verletzte behandelt.",true,"Sie lernten die Behandlung von Verletzten und Verwundeten."],
["In Kartenkunde benutzten die Soldaten digitale Navigationsgeräte.",false,"Im Text werden militärische Karten und der Kompass genannt."],
["Beim ABC-Training mussten die Soldaten Gasmasken tragen.",true,"Sie mussten Gasmasken aufsetzen."],
["Das ABC-Training fand im Freien statt.",false,"Die Soldaten mussten sich in einem Raum mit Tränengas aufhalten."],
["Die Schießausbildung machte dem Erzähler am meisten Spaß.",true,"Das sagt der Erzähler ausdrücklich."],
["Die Soldaten lernten auch, wie man Waffen reinigt und wartet.",true,"Die Ausbilder zeigten ihnen die Pflege und Wartung der Waffen."],
["Auf der Hindernisbahn mussten die Soldaten lange Strecken laufen.",false,"Im Text geht es um Klettern, Springen, Kriechen und Balancieren."],
["In Neigungsgruppen konnten die Soldaten ihre Lieblingssportart trainieren.",true,"Sie konnten eine Sportart machen, die ihnen besonders Spaß machte."],
["Während des Biwaks übernachteten die Soldaten mehrere Nächte draußen.",true,"Sie verbrachten mehrere Nächte im Freien."],
["Die Grundausbildung bei der Bundeswehr dauert 16 Wochen.",false,"Im Text steht, dass die Grundausbildung drei Monate dauert."]
];
let answers=Array(items.length).fill(null);const root=document.getElementById('questions');const result=document.getElementById('result');function render(){root.innerHTML='';items.forEach(([sentence,truth,explanation],i)=>{const card=document.createElement('section');card.className='card';const number=document.createElement('div');number.className='num';number.textContent=`Aussage ${i+1} von ${items.length}`;const p=document.createElement('p');p.className='statement';p.textContent=sentence;const choices=document.createElement('div');choices.className='choices';[true,false].forEach(value=>{const btn=document.createElement('button');btn.textContent=value?'Richtig':'Falsch';btn.disabled=answers[i]!==null;btn.className=answers[i]===value?'selected':'';btn.addEventListener('click',()=>{answers[i]=value;render();});choices.appendChild(btn)});card.append(number,p,choices);if(answers[i]!==null){const fb=document.createElement('div');const ok=answers[i]===truth;fb.className='feedback '+(ok?'correct':'incorrect');fb.textContent=(ok?'✓ Richtig! ':'✗ Leider falsch. ')+explanation;card.appendChild(fb)}root.appendChild(card)});const done=answers.filter(a=>a!==null).length;const score=answers.filter((a,i)=>a===items[i][1]).length;result.textContent=done===items.length?`Ergebnis: ${score} von ${items.length} Punkten (${Math.round(score/items.length*100)} %).`:`Beantwortet: ${done} von ${items.length} · Bisher richtig: ${score}`;}document.getElementById('restart').addEventListener('click',()=>{answers=Array(items.length).fill(null);render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
