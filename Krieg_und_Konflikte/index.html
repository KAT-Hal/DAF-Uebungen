<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krieg und Frieden – B1</title><style>:root{--green:#087c60;--pale:#e8f5ef}*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,Arial;color:#24342e;background:#f4f7f5}.wrap{max-width:960px;margin:auto;padding:18px}header{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0001}header img{width:100%;max-height:280px;object-fit:cover;display:block}header div{padding:16px 22px}h1{margin:0;color:var(--green);font-size:1.7rem}h2{color:var(--green);margin:0 0 12px}nav{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:#f4f7f5;padding:12px 0;z-index:3}nav button{white-space:nowrap;background:white;color:#245443;border:1px solid #a9cdbd;border-radius:9px;padding:10px 16px;cursor:pointer;font-size:1rem}nav button.active{background:var(--green);color:white}section{display:none;background:white;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 2px 10px #0001}section.active{display:block}.words{color:var(--green);font-weight:600;background:var(--pale);border-radius:9px;padding:12px;margin:14px 0}.q{padding:10px 8px;border-bottom:1px solid #e8eee9}.q:last-child{border:0}input,select{font:inherit;border:1px solid #abbcb2;border-radius:7px;padding:7px;background:white;max-width:100%}input[type=text]{width:210px}textarea{width:100%;min-height:62px;resize:vertical}.q select{margin:0 4px;max-width:100%}.ok{background:#d7f4df!important;border-color:#259b53!important}.bad{background:#ffe0df!important;border-color:#d34d4d!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.action{border:0;background:var(--green);color:white;border-radius:9px;padding:11px 17px;cursor:pointer;font-size:1rem}button.secondary{background:#e6eee9;color:#184d3a}.feedback{font-weight:600;margin:12px 0;color:#225e43}.small{font-size:.9rem;color:#53675d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{border:1px solid #e0e9e2;padding:9px;border-radius:9px}.item select{display:block;width:100%;margin-top:6px}.wordgreen{color:var(--green);font-weight:650}.pair{display:grid;grid-template-columns:1fr 170px;gap:8px;align-items:center}.num{font-weight:bold;color:var(--green)}@media(max-width:600px){.wrap{padding:8px}section{padding:16px}.grid{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.pair select{width:100%}header img{max-height:180px}input[type=text]{width:170px}nav button{padding:9px 12px}}.drag-bank{display:flex;flex-wrap:wrap;gap:9px;background:#e8f5ef;border-radius:9px;padding:12px;margin:12px 0 18px}.chip{font:inherit;color:#086d55;background:white;border:1px solid #6eac95;border-radius:8px;padding:7px 11px;cursor:grab;touch-action:manipulation}.chip.selected{background:#087c60;color:white}.chip.used{opacity:.28;cursor:default}.drop-field{width:220px!important;max-width:100%;cursor:pointer;background:#f6faf7!important;border:2px dashed #84ad9a!important;text-align:center}.drop-field.ok{background:#d7f4df!important;border:2px solid #259b53!important}.drop-field.bad{background:#ffe0df!important;border:2px solid #d34d4d!important}@media(max-width:600px){.drop-field{width:185px!important;font-size:15px}}</style></head><body><div class="wrap"><header><img src="vorschaubild.png" alt="Grüne Strichzeichnung: Grenzstreit zwischen zwei Staaten"><div><h1>Krieg und Frieden</h1><div>Wortschatz und Redemittel · DaF B1</div></div></header><nav id="tabs"></nav><main id="pages"></main></div><script>
const exercises=[
{title:'Grundwortschatz',intro:'Erklären Sie die grün markierten Wörter mit eigenen Worten oder nennen Sie ein Synonym. Diese Aufgabe wird im Unterricht besprochen.',type:'write',sentences:[['In der Region gibt es seit mehreren Jahren einen','bewaffneten Konflikt','.'],['Zwischen den beiden Nachbarstaaten gibt es seit Jahren','Grenzstreitigkeiten',', weil beide dasselbe Gebiet für sich beanspruchen.'],['Die Soldaten haben den','Befehl','erhalten, die Grenze zu sichern.'],['Bei dem','Angriff','wurden mehrere Gebäude zerstört.'],['Die Regierung hat beschlossen, zusätzliche','Truppen','zu schicken.'],['Die Bevölkerung leidet unter der anhaltenden','Gewalt','.'],['Viele Menschen mussten aus ihrer Heimat','fliehen','.'],['Die Vereinten Nationen wollen zwischen den Konfliktparteien','vermitteln','.'],['Die Armee hat sich aus dem besetzten','Gebiet','zurückgezogen.']]},
{title:'Krieg und Waffen',type:'mixed'},
{title:'Die Streitkräfte',type:'forces'},
{title:'Verben im Krieg',type:'gaps',intro:'Ergänzen Sie die Verben in der richtigen Form.',words:'angreifen · versorgen · zerstören · zurückziehen · besetzen · explodieren',sentences:['Die Armee hat das Nachbarland {0}.','Während des Luftangriffs wurden mehrere Brücken {1}.','Die Soldaten haben sich aus der Stadt {2}.','Eine Bombe ist in der Nähe des Bahnhofs {3}.','Die Hilfsorganisation {4} die Bevölkerung seit Wochen mit Lebensmitteln.','Die feindlichen Truppen haben gestern eine wichtige Stadt {5}.'],answers:[['angegriffen','besetzt'],['zerstört'],['zurückgezogen'],['explodiert'],['versorgt'],['angegriffen','besetzt']]},
{title:'Der Beginn eines Krieges',type:'gaps',intro:'Ergänzen Sie die Sätze mit den passenden Wörtern. Jedes Wort wird einmal verwendet.',words:'verschärfen · ethnisch · eskalieren · Streit · beteiligt · Truppen · verhandeln · ausbrechen',sentences:['Viele Konflikte entstehen durch politische, wirtschaftliche oder {0} Unterschiede.','Zwischen den beiden Ländern gibt es seit Jahren einen {1} über die gemeinsame Grenze.','Die Situation kann sich {2}, wenn keine diplomatische Lösung gefunden wird.','Wenn die Konfliktparteien nicht miteinander sprechen, kann die Situation {3}.','Mehrere Staaten sind an den Verhandlungen {4}.','Die Regierung hat beschlossen, zusätzliche {5} an die Grenze zu schicken.','Die beiden Seiten wollen zunächst {6}, um eine friedliche Lösung zu finden.','Viele Menschen befürchten, dass bald ein Krieg {7} könnte.'],answers:[['ethnische'],['Streit'],['verschärfen','eskalieren'],['eskalieren','sich verschärfen'],['beteiligt'],['Truppen'],['verhandeln'],['ausbrechen']]},
{title:'Kriegsberichte',type:'matching'},
{title:'Frieden wiederherstellen',type:'peace'}];
const forceTerms=['Panzer','U-Boot','Kampfflugzeug','Fregatte','Infanterie','Hubschrauber','Zerstörer','Artillerie','Fallschirmjäger','Kampfschiff','Transportflugzeug','Kampfpanzer','Pilot','Matrose','Marineinfanterie','Jagdflugzeug','Kriegsschiff','Panzergrenadier'];const forceAns=['Heer','Marine','Luftwaffe','Marine','Mehrere','Mehrere','Marine','Heer','Heer','Marine','Mehrere','Heer','Mehrere','Marine','Marine','Luftwaffe','Marine','Heer'];
const starts=['Die Regierung hat beschlossen, die humanitäre Hilfe ...','Die Rebellen versuchen, mehrere Dörfer ...','Die Soldaten wurden angewiesen, die Grenze ...','Bei dem Angriff wurden mehrere Zivilisten ...','Tausende Menschen sind in die Nachbarländer ...','Die Vereinten Nationen fordern, die Gewalt sofort ...','Die Konfliktparteien haben vereinbart, einen Waffenstillstand ...','Hilfsorganisationen versuchen, Lebensmittel und Medikamente ...'];const endings=['einzunehmen.','geflohen.','zu verstärken.','zu sichern.','verletzt.','einzuhalten.','zu beenden.','zu verteilen.'];const matchAns=['c','a','d','e','b','g','f','h'];
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(id,placeholder='Antwort'){return `<input type="text" id="${id}" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">`}function select(id,opts){return `<select id="${id}"><option value="">Bitte wählen</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`}function q(s){return `<div class="q">${s}</div>`}function words(s){return `<div class="words">${esc(s)}</div>`}function actions(n,check=true){return `<div class="actions">${check?`<button class="action" onclick="check(${n})">Antworten überprüfen</button>`:''}<button class="action secondary" onclick="reset(${n})">Zurücksetzen</button></div><div class="feedback" id="feedback${n}" aria-live="polite"></div>`}let selectedChip=null;
function dragBank(bank,arr){return `<div class="drag-bank" id="bank-${bank}" aria-label="Wortliste">${arr.map((w,i)=>`<button type="button" class="chip" draggable="true" data-bank="${bank}" data-word="${esc(w)}" ondragstart="chipDrag(event)" onclick="chooseChip(this)">${esc(w)}</button>`).join('')}</div>`}
function dropField(id,bank){return `<input type="text" readonly class="drop-field" id="${id}" data-bank="${bank}" placeholder="Wort hier ablegen" ondragover="event.preventDefault()" ondrop="chipDrop(event,this)" onclick="placeSelected(this)" aria-label="Lücke: Wort ablegen">`}
function chooseChip(chip){if(chip.disabled)return;document.querySelectorAll('.chip.selected').forEach(c=>c.classList.remove('selected'));selectedChip=selectedChip===chip?null:chip;if(selectedChip)selectedChip.classList.add('selected')}
function chipDrag(ev){selectedChip=ev.target;ev.dataTransfer.setData('text/plain',ev.target.dataset.word);ev.dataTransfer.effectAllowed='move'}
function chipDrop(ev,target){ev.preventDefault();const w=ev.dataTransfer.getData('text/plain');const chip=[...document.querySelectorAll('.chip')].find(c=>c.dataset.word===w&&c.dataset.bank===target.dataset.bank&&!c.disabled);if(chip)putChip(chip,target)}
function placeSelected(target){if(selectedChip&&selectedChip.dataset.bank===target.dataset.bank){putChip(selectedChip,target)}else if(target.value){returnChip(target)}}
function returnChip(target){const bank=target.dataset.bank,word=target.value;const chip=[...document.querySelectorAll('.chip')].find(c=>c.dataset.bank===bank&&c.dataset.word===word);if(chip){chip.disabled=false;chip.classList.remove('used')}target.value='';target.classList.remove('ok','bad')}
function putChip(chip,target){if(target.value)returnChip(target);target.value=chip.dataset.word;target.classList.remove('ok','bad');chip.disabled=true;chip.classList.add('used');chip.classList.remove('selected');selectedChip=null}
function render(e,n){let out=`<h2>${n+1}. ${e.title}</h2>`;if(e.intro)out+=`<p>${e.intro}</p>`;if(e.words)out+=words(e.words);if(e.type==='write'){e.sentences.forEach((s,i)=>out+=q(`<span class="num">${i+1}.</span> ${esc(s[0])} <span class="wordgreen">${esc(s[1])}</span>${esc(s[2])}<textarea id="f${n}_${i}" placeholder="Ihre Erklärung / Ihr Synonym"></textarea>`));out+=actions(n,false)}if(e.type==='mixed'){out+='<h3>A. Wortgruppen</h3><p>Welches Wort passt zu welcher Gruppe?</p>'+words('Soldaten · Waffen · Krieg');['Bürger-, Welt-, Atom-, Verteidigungs-','Schuss-, Atom-, Hand-, Massenvernichtungs-','Berufs-, Zeit-, Kinder-, Reserve-'].forEach((x,i)=>out+=q(`${'abc'[i]}. ${x} ${select('f1_a'+i,['Soldaten','Waffen','Krieg'])}`));out+='<h3>B. Zusammengesetzte Wörter</h3><p>Ergänzen Sie die zusammengesetzten Wörter aus A. Achten Sie auf die richtige Form.</p>';['Im Zweiten {0} starben Millionen Menschen.','{1} sind international besonders umstritten, weil sie große Gebiete zerstören können.','Ein {2} findet innerhalb eines Landes zwischen verschiedenen Gruppen statt.','Ein {3} verpflichtet sich für eine bestimmte Zeit zum Dienst in den Streitkräften.','Der Einsatz von {4} ist nach internationalem Recht verboten.','Ein {5} dient dauerhaft in den Streitkräften.'].forEach((s,i)=>out+=q(`${i+1}. ${s.replace('{'+i+'}',field('f1_b'+i))}`));out+=actions(n)}if(e.type==='forces'){out+='<p>Ordnen Sie die Begriffe den Teilstreitkräften zu. Einige Begriffe passen zu mehreren Teilstreitkräften.</p><div class="grid">';forceTerms.forEach((t,i)=>out+=`<div class="item"><b>${esc(t)}</b>${select('f2_'+i,['Heer','Marine','Luftwaffe','Mehrere'])}</div>`);out+='</div>'+actions(n)}if(e.type==='gaps'){e.sentences.forEach((s,i)=>out+=q(`${i+1}. ${s.replace('{'+i+'}',field('f'+n+'_'+i))}`));out+=actions(n)}if(e.type==='matching'){out+='<p>Wählen Sie für jeden Satz das passende Verb aus.</p>';starts.forEach((s,i)=>out+=q(`<div class="pair"><span>${i+1}. ${esc(s)}</span>${select('f5_'+i,endings)}</div>`));out+=actions(n)}if(e.type==='peace'){out+='<h3>A. Ergänzen Sie den Text</h3><p>Ziehen Sie die Wörter in die passenden Lücken. Auf dem Handy können Sie auch erst ein Wort und dann eine Lücke antippen.</p>'+dragBank('a',['Waffenstillstand','Friedensverhandlungen','Abkommen','Friedenstruppen','Konfliktparteien','Frieden']);let pars=[`Nach mehreren Monaten schwerer Kämpfe haben die beiden ${dropField('f6_a0','a')} einem vorläufigen ${dropField('f6_a1','a')} zugestimmt. Die Waffen sollen zunächst für zwei Wochen schweigen.`,`Vertreter beider Seiten haben angekündigt, dass sie bald mit ${dropField('f6_a2','a')} beginnen wollen. Dabei soll über die Zukunft der umstrittenen Gebiete gesprochen werden.`,`Die Vereinten Nationen prüfen, ob internationale ${dropField('f6_a3','a')} in die Region geschickt werden können. Sie sollen die Einhaltung der Vereinbarungen überwachen.`,`Wenn die Gespräche erfolgreich sind, könnten beide Seiten ein ${dropField('f6_a4','a')} unterzeichnen. Langfristig hoffen die Menschen auf einen dauerhaften ${dropField('f6_a5','a')}.`];pars.forEach(p=>out+=q(p));out+='<h3>B. Typische Wortverbindungen</h3><p>Ordnen Sie die Verben zu.</p>'+dragBank('b',['schließen','einhalten','unterzeichnen','führen','entsenden']);['einen Waffenstillstand','ein Abkommen / einen Vertrag','Friedensverhandlungen','Friedenstruppen','Frieden'].forEach((x,i)=>out+=q(`${i+1}. ${x} ${dropField('f6_b'+i,'b')}`));out+=actions(n)}return out}
const tabs=document.getElementById('tabs'),pages=document.getElementById('pages');exercises.forEach((e,i)=>{tabs.innerHTML+=`<button onclick="show(${i})" id="tab${i}">Übung ${i+1}</button>`;pages.innerHTML+=`<section id="page${i}">${render(e,i)}</section>`});function show(n){exercises.forEach((_,i)=>{document.getElementById('tab'+i).classList.toggle('active',i===n);document.getElementById('page'+i).classList.toggle('active',i===n)});window.scrollTo({top:0,behavior:'smooth'})}show(0);
function norm(s){return s.trim().toLocaleLowerCase('de').replace(/\s+/g,' ').replace(/[.!]+$/,'')}function evaluate(id,ans){const el=document.getElementById(id);if(!el)return null;let good=ans.some(a=>norm(a)===norm(el.value));el.classList.toggle('ok',good);el.classList.toggle('bad',!good);return good}function check(n){let results=[];const add=(id,a)=>results.push(evaluate(id,Array.isArray(a)?a:[a]));if(n===1){['Krieg','Waffen','Soldaten'].forEach((x,i)=>add('f1_a'+i,x));[['Weltkrieg'],['Atomwaffen'],['Bürgerkrieg'],['Zeitsoldat'],['Massenvernichtungswaffen'],['Berufssoldat']].forEach((a,i)=>add('f1_b'+i,a))}if(n===2)forceAns.forEach((a,i)=>add('f2_'+i,a));if(n===3||n===4)exercises[n].answers.forEach((a,i)=>add('f'+n+'_'+i,a));if(n===5)matchAns.forEach((a,i)=>add('f5_'+i,endings['abcdefgh'.indexOf(a)]));if(n===6){[['Konfliktparteien'],['Waffenstillstand'],['Friedensverhandlungen'],['Friedenstruppen'],['Abkommen'],['Frieden']].forEach((a,i)=>add('f6_a'+i,a));['einhalten','unterzeichnen','führen','entsenden','schließen'].forEach((a,i)=>add('f6_b'+i,a))}const good=results.filter(Boolean).length;document.getElementById('feedback'+n).textContent=`${good} von ${results.length} Antworten richtig. Grün = richtig, Rot = bitte noch einmal versuchen.`}function reset(n){if(n===6){document.querySelectorAll('#page6 .chip').forEach(c=>{c.disabled=false;c.classList.remove('used','selected')});selectedChip=null}document.querySelectorAll(`#page${n} input,#page${n} textarea,#page${n} select`).forEach(el=>{el.value='';el.classList.remove('ok','bad')});document.getElementById('feedback'+n).textContent=''}
</script></body></html>
