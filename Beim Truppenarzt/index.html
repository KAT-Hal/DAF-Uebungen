ucht.", "Die Person, mit der man bei der Bundeswehr ein Zimmer teilt.", "Eine Krankheit, die andere Menschen durch Kontakt bekommen können.", "Starke, oft plötzlich auftretende Schmerzen im Bauch.", "Der Inhalt des Magens kommt durch den Mund wieder heraus.", "Zum Beispiel Wasser, Tee oder Saft.", "Eine bestimmte Menge Essen, die man auf einmal bekommt.", "Der Wunsch, etwas zu essen, weil man Hunger hat.", "So krank sein, dass man vorübergehend keinen Dienst machen kann.", "Sehr genau und sorgfältig, sodass möglichst nichts vergessen wird.", "Eine Person, die bei der Arbeit oder beim Militär Anweisungen geben darf.", "Das, was der Körper nach der Verdauung über den Darm ausscheidet."], "vkey": ["C", "A", "H", "E", "F", "G", "I", "D", "K", "J", "L", "B", "M", "N", "O"], "rf": ["Benjamin hat seit mehreren Tagen Bauchschmerzen und Durchfall.", "Benjamin musste in der vergangenen Nacht fünfmal auf die Toilette und hat sich zweimal übergeben.", "Benjamin hat heute Morgen nur wenig gefrühstückt, weil ihm schlecht war.", "Ein anderer Soldat aus Benjamins Stube hatte ebenfalls Magen-Darm-Beschwerden.", "Benjamin hat ständig starke Bauchschmerzen, besonders in der Mitte des Bauches.", "Die Ärztin möchte Benjamin vorsichtshalber ins Krankenhaus schicken.", "Die Elektrolytlösung soll dem Körper helfen, verlorene Flüssigkeit und wichtige Salze zu ersetzen.", "Benjamin soll erst wieder etwas essen, wenn er vollständig gesund ist.", "Benjamin soll möglichst eine eigene Toilette benutzen, damit er andere Soldaten nicht ansteckt.", "Wenn Benjamin Blut im Stuhl bemerkt oder starke Bauchschmerzen bekommt, soll er sofort wieder zum Arzt gehen."], "rkey": ["F", "R", "F", "R", "F", "F", "R", "F", "R", "R"], "mc": [{"q": "Welche Symptome hat Benjamin Sperling?", "opts": ["Er hat Bauchschmerzen, Durchfall und Übelkeit, musste sich aber nicht übergeben.", "Er hat Bauchschmerzen, Durchfall, Übelkeit und Erbrechen.", "Er hat starke Bauchkrämpfe, hohes Fieber und Durchfall."], "key": "B"}, {" function switchTo(i){if(i===current)return;current=i;loadAudio();render();window.scrollTo({top:0,behavior:"smooth"})}
let audio=$("audio");
function loadAudio(){audio.pause();audio.src=DATA[current].audio;audio.load();$("audioLabel").textContent="Gespräch "+(current+1)+" · "+DATA[current].name;$("notice").textContent="";$("play").textContent="▶";$("seek").value=0;$("elapsed").textContent="0:00";$("duration").textContent="0:00"}
$("play").onclick=()=>{if(audio.paused){audio.play().catch(()=>$("notice").textContent="Audio nicht gefunden. Bitte MP3-Dateinamen prüfen.")}else audio.pause()};
$("back").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);
$("forward").onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+5)};
$("volume").oninput=e=>audio.volume=Number(e.target.value);
$("seek").oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(e.target.value)/1000*audio.duration};
audio.ontimeupdate=()=>{$("elapsed").textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)$("seek").value=Math.round(1000*audio.currentTime/audio.duration)};
audio.onloadedmetadata=()=>{$("duration").textContent=fmt(audio.duration);$("notice").textContent=""};
audio.onpause=()=>{$("play").textContent="▶"};audio.onplay=()=>{$("play").textContent="⏸"};
audio.onerror=()=>{$("notice").textContent="MP3-Datei fehlt oder kann nicht abgespielt werden."};
loadAudio();render();
</script></body></html>
