<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Der Zweite Weltkrieg – Text und Übungen</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#23334a;background:#edf2f8}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(120deg,#1c3149,#50657c);color:white;padding:30px max(18px,calc((100vw - 1050px)/2))}.hero h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:0 0 8px}.hero p{margin:0;opacity:.88}.wrap{max-width:1050px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;background:#edf2f8;padding:12px 0;z-index:10}.tab{white-space:nowrap;border:1px solid #c4d0de;background:white;border-radius:10px;padding:11px 15px;font-weight:650;color:#263c56;cursor:pointer}.tab.active{background:#294a6e;color:white}.panel{display:none;background:white;border:1px solid #d9e1ec;border-radius:16px;padding:clamp(16px,3vw,32px);box-shadow:0 3px 16px #142b4410}.panel.active{display:block}h2{margin:0 0 12px;color:#213e5e}h3{margin:28px 0 12px;color:#294a6e}.reading p{line-height:1.75;font-size:1.05rem}.reading section{border-bottom:1px solid #e7ecf3;padding-bottom:12px}.instructions{color:#526176}.bank{position:sticky;top:64px;background:#e9f1fa;border:1px solid #bad0e7;border-radius:12px;padding:12px;margin:16px 0;z-index:5;line-height:2.2}.chip{display:inline-block;border-radius:7px;padding:2px 8px;background:white;border:1px solid #b9cbe0;margin:3px;font-size:.92rem}.q{padding:13px 0;border-bottom:1px solid #e8edf4;line-height:1.65}.q strong{color:#45617f}.answer{display:block;margin:7px 0 0;max-width:340px;width:100%;padding:9px;border:1px solid #aabbd0;border-radius:8px;background:white;color:#1e334c;font-size:1rem}.answer:focus{outline:2px solid #739ac2}.choice{display:block;padding:8px;margin:6px 0;border:1px solid #d4dfeb;border-radius:8px;cursor:pointer}.choice input{margin-right:9px}.correct{background:#e2f5e8!important;border-color:#32965a!important}.wrong{background:#fde8e7!important;border-color:#d24b45!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:9px;padding:11px 17px;background:#294a6e;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e6eef6;color:#294a6e}.result{font-weight:700;min-height:26px}.picture-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}.picture{border:1px solid #d9e3ef;border-radius:12px;padding:10px;background:#fafcff}.illustration{height:125px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:9px;background:linear-gradient(160deg,#b7c7cf,#e8ded0)}.illustration:before{content:'';position:absolute;bottom:0;left:0;width:100%;height:24%;background:#64796a66}.illustration .emoji{font-size:64px;filter:drop-shadow(3px 5px 2px #0003);z-index:1}.illustration .sun{position:absolute;top:12px;right:15px;border-radius:100%;background:#f3d6a5;width:34px;height:34px;opacity:.8}.picture .answer{font-size:.9rem}.picture small{color:#69798a}.foot{font-size:.85rem;color:#6a7888;margin:24px 0}.note{background:#fff7e9;border-left:4px solid #dba84c;padding:12px;margin:16px 0}input[type=text]{min-width:140px}.inline-input{width:150px;border:0;border-bottom:2px solid #8ca2b9;border-radius:0;padding:5px 3px;font:inherit;background:#f8fafc;text-align:center}button:hover{filter:brightness(.95)}@media(max-width:600px){.tabs{top:0}.bank{top:63px;max-height:32vh;overflow-y:auto}.picture-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.illustration{height:100px}.illustration .emoji{font-size:50px}}
.history-image{width:100%;aspect-ratio:1.85;object-fit:cover;display:block;border-radius:8px;margin:8px 0} </style></head><body><header class="hero"><h1>Der Zweite Weltkrieg (1939–1945)</h1><p>Lesetext und 120 interaktive Aufgaben · Niveau B1–B2</p></header><main class="wrap"><nav class="tabs" id="tabs" aria-label="Übungsreiter"></nav><div id="panels"></div><p class="foot">Historisches Lernmaterial · Die Bildkarten zeigen gezeichnete historische Szenen, keine Fotografien.</p></main><script src="data.js"></script><script>
const D=window.WW2_DATA;
// Korrekturen zu den Grammatikübungen; alle anderen Daten bleiben unverändert.
D.gram[0][2]='als · während · bevor · nachdem';
D.gram[0][3][9]=['__________ Ostdeutschland zum Warschauer Pakt gehörte, war Westdeutschland Mitglied der NATO.','Während'];
D.gram[2][2]='unter · mit · zu · vor · in · nach · gegen · im · zur · unter';
const tabs=[['text','Lesetext'],['vocab','Übung 1 · Wortschatz'],['rf','Übung 2 · R/F'],['mc','Übung 3 · MC'],['pics','Übung 4 · Bilder'],['gram','Übung 5 · Grammatik']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);let tests={};function register(group,answer){const id='a'+Object.keys(tests).length;tests[id]={group,answer};return id}function selectHTML(id,words){return `<select class="answer" id="${id}" aria-label="Antwort auswählen"><option value="">– Bitte wählen –</option>${shuffle(words).map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select>`}function action(group){return `<div class="actions"><button class="btn" onclick="check('${group}')">Antworten überprüfen</button><button class="btn secondary" onclick="resetGroup('${group}')">Zurücksetzen</button><span class="result" id="result-${group}" aria-live="polite"></span></div>`}function panel(id,title,body){return `<article id="panel-${id}" class="panel"><h2>${title}</h2>${body}</article>`}let content='';content+=panel('text','Der Zweite Weltkrieg (1939–1945)',`<p class="instructions">Lesen Sie den Text und bearbeiten Sie anschließend die Übungen.</p><div class="reading">${D.sections.map(([t,p])=>`<section><h3>${esc(t)}</h3><p>${esc(p)}</p></section>`).join('')}</div>`);
let voc='<p class="instructions">Ordnen Sie die Begriffe den Erklärungen zu. Jede Antwort wird nur einmal verwendet. Die Reihenfolge der Wörter wird beim Laden neu gemischt.</p>';D.vocab.forEach(([words,items],i)=>{let group='v'+i;voc+=`<h3>1${'ABCD'[i]} – ${['Ursachen, Ziele und Länder','Kriegsführung und Waffen','Verletzungen und Versorgung','Verfolgung, Kriegsende und Folgen'][i]}</h3><div class="bank">${shuffle(words).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`;items.forEach(([q,a],j)=>{let id=register(group,a);voc+=`<div class="q"><strong>${j+1}.</strong> ${esc(q)}${selectHTML(id,words)}</div>`});voc+=action(group)});content+=panel('vocab','Übung 1 – Wortschatz (4 × 10)',voc);
let rf='<p class="instructions">Entscheiden Sie: richtig oder falsch?</p>';D.rf.forEach(([q,a],i)=>{let id=register('rf',a?'R':'F');rf+=`<div class="q"><strong>${i+1}.</strong> ${esc(q)}<div><label class="choice"><input type="radio" name="${id}" value="R"> Richtig</label><label class="choice"><input type="radio" name="${id}" value="F"> Falsch</label></div><span id="feedback-${id}"></span></div>`});content+=panel('rf','Übung 2 – Richtig oder falsch? (10)',rf+action('rf'));
let mc='<p class="instructions">Kreuzen Sie jeweils die richtige Antwort an. Nur eine Antwort ist richtig.</p>';D.mc.forEach(([q,options,correct],i)=>{let id=register('mc',options[correct]);mc+=`<div class="q"><strong>${i+1}.</strong> ${esc(q)}${shuffle(options).map(o=>`<label class="choice"><input type="radio" name="${id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}<span id="feedback-${id}"></span></div>`});content+=panel('mc','Übung 3 – Multiple Choice (10)',mc+action('mc'));
let pic='<p class="instructions">Sehen Sie sich die 20 historischen Illustrationen an. Ordnen Sie jedem Bild den passenden Begriff zu.</p>';let terms=D.images.map(x=>x[0]);pic+=`<div class="bank">${shuffle(terms).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div><div class="picture-grid">`;D.images.forEach(([name,emoji,description],i)=>{let id=register('pics',name);pic+=`<div class="picture"><strong>Bild ${i+1}</strong><img class="history-image" src="bilder/bild_${String(i+1).padStart(2,'0')}.jpg" alt="Historische Illustration Bild ${i+1}" loading="lazy">${selectHTML(id,terms)}</div>`});pic+='</div>';content+=panel('pics','Übung 4 – Bildzuordnung (20)',pic+action('pics'));
let gram='<p class="instructions">Ergänzen Sie in jeder Lücke genau ein Wort. Achten Sie auf die richtige Form.</p>';D.gram.forEach(([title,instruction,bank,items],i)=>{let group='g'+i;gram+=`<h3>${esc(title)}</h3><p>${esc(instruction)}</p>${bank?`<div class="bank">${shuffle(bank.split(' · ')).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`:''}`;items.forEach(([q,a],j)=>{let id=register(group,a);let parts=q.split('__________');gram+=`<div class="q"><strong>${j+1}.</strong> ${esc(parts[0])}<input class="inline-input" type="text" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke ${j+1}">${esc(parts.slice(1).join('__________'))}</div>`});gram+=action(group)});content+=panel('gram','Übung 5 – Grammatik (4 × 10)',gram);document.getElementById('panels').innerHTML=content;document.getElementById('tabs').innerHTML=tabs.map(([id,title])=>`<button class="tab" id="tab-${id}" onclick="show('${id}')">${title}</button>`).join('');function show(id){document.querySelectorAll('.panel').forEach(e=>e.classList.toggle('active',e.id==='panel-'+id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.id==='tab-'+id));window.scrollTo({top:0,behavior:'instant'})}show('text');function normalize(s){return String(s).trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ')}function check(group){let total=0,ok=0;Object.entries(tests).forEach(([id,t])=>{if(t.group!==group)return;total++;let node=document.getElementById(id),selected=document.querySelector(`input[name="${id}"]:checked`);let val=node?node.value:selected?selected.value:'';let target=node||document.getElementById('feedback-'+id);target.classList.remove('correct','wrong');let pass=normalize(val)===normalize(t.answer)||(group==='g1'&&id===Object.keys(tests).filter(k=>tests[k].group==='g1')[6]&&['weil','da'].includes(normalize(val)));if(val){target.classList.add(pass?'correct':'wrong');if(pass)ok++}if(selected){document.querySelectorAll(`input[name="${id}"]`).forEach(r=>r.closest('label').classList.remove('correct','wrong'));selected.closest('label').classList.add(pass?'correct':'wrong')}});document.getElementById('result-'+group).textContent=`${ok} von ${total} richtig.`}function resetGroup(group){Object.entries(tests).forEach(([id,t])=>{if(t.group!==group)return;let node=document.getElementById(id);if(node){node.value='';node.classList.remove('correct','wrong')}document.querySelectorAll(`input[name="${id}"]`).forEach(r=>{r.checked=false;r.closest('label').classList.remove('correct','wrong')})});document.getElementById('result-'+group).textContent=''}
</script></body></html>
