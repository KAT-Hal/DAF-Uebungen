<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Organisation der Bundeswehr – Wortschatz</title><meta property="og:title" content="Die Organisation der Bundeswehr – Wortschatzübung"><meta property="og:image" content="https://kat-hal.github.io/DAF-Uebungen/Organisation_der_Bundeswehr/Vorschaubild.png"><style>body{font:17px/1.6 system-ui,Arial,sans-serif;background:#f2f6fa;color:#172a40;margin:0}main{max-width:970px;margin:auto;padding:22px}.panel{background:white;border-radius:15px;padding:25px;margin:20px 0;box-shadow:0 3px 15px #162d4512}h1{line-height:1.2}img{width:100%;height:auto;border-radius:8px}.words{display:flex;flex-wrap:wrap;gap:9px;padding:12px;background:#e8f3fb;border-radius:9px}.word{background:white;border:1px solid #9fc4d8;border-radius:7px;padding:5px 10px}li{margin:14px 0}input{font:inherit;width:185px;max-width:90%;border:1px solid #8da1b5;border-radius:5px;padding:4px}button{background:#11668c;color:white;border:0;padding:12px 18px;border-radius:8px;font:inherit;cursor:pointer;margin:6px}.ok{background:#e1f5e6}.bad{background:#ffe7e2}small{color:#526577}.feedback{font-size:14px;margin-left:7px}#result{font-weight:bold}</style></head><body><main><div class="panel"><h1>Die Organisation der Bundeswehr</h1><p>Wortschatzübung · 20 Fragen</p><img src="Vorschaubild.png" alt="Übersicht über die Teilstreitkräfte und den Unterstützungsbereich"></div><div class="panel"><h2>Wörter einsetzen</h2><p>Lesen Sie die Fragen und ergänzen Sie die passende Antwort. Verwenden Sie die Wörter und Ausdrücke aus der Wortbox. Jedes Wort passt einmal.</p><div class="words" id="words"></div><ol id="questions"></ol><button onclick="check()">Überprüfen</button><button onclick="resetAll()">Erneut bearbeiten</button><p id="result" aria-live="polite"></p></div></main><script>const words=["an Land", "Treibstoff", "Katastrophen", "ermitteln", "Seewege", "Versorgung", "überwacht", "Ausrüstung", "schützen", "Nahrung", "im Ausland", "transportieren", "Luftraum", "Gefahren", "Kommunikation", "betreibt", "verletzten", "Angriffen", "erkennen", "beobachten"];const items=[["Was machen Soldaten? Sie ___ das Land.", "schützen"], ["Wo kämpfen Soldaten im Heer? Sie kämpfen ___.", "an Land"], ["Was überwacht die Luftwaffe? Sie überwacht den ___.", "Luftraum"], ["Wobei hilft die Luftwaffe außer bei militärischen Aufgaben? Sie hilft bei ___.", "Katastrophen"], ["Was macht die Marine mit den Seewegen? Sie ___ sie.", "überwacht"], ["Was müssen die Soldaten der Marine für die Schifffahrt tun? Sie müssen die ___ schützen.", "Seewege"], ["Was schützt der Cyber- und Informationsraum? Er schützt digitale Systeme vor ___ aus dem Internet.", "Angriffen"], ["Wofür sorgt der Cyber- und Informationsraum? Er sorgt für sichere ___.", "Kommunikation"], ["Was machen Soldaten im CIR, um mögliche Probleme zu erkennen? Sie ___ Gefahren.", "beobachten"], ["Was tun die Feldjäger bei Straftaten? Sie ___.", "ermitteln"], ["Was machen Ärzte und Pflegekräfte mit kranken Soldaten? Sie kümmern sich um ihre medizinische ___.", "Versorgung"], ["Wem hilft der Sanitätsdienst außer kranken Soldaten? Er hilft auch ___ Soldaten.", "verletzten"], ["Wo kann der Sanitätsdienst ebenfalls im Einsatz sein? ___.", "im Ausland"], ["Was macht der Bereich Logistik? Er muss Personen und Material ___.", "transportieren"], ["Womit versorgt die Logistik die hungrige Truppe? Mit ___.", "Nahrung"], ["Was brauchen die meisten Fahrzeuge und Flugzeuge? Sie brauchen ___.", "Treibstoff"], ["Was beschafft die Logistik? Sie beschafft ___ für die Soldaten.", "Ausrüstung"], ["Was macht der Bereich Infrastruktur mit Kasernen und Flugplätzen? Er baut und ___ sie.", "betreibt"], ["Wovor schützt die ABC-Abwehr die Soldaten? Vor atomaren, biologischen und chemischen ___.", "Gefahren"], ["Was müssen Soldaten im Cyber-Raum möglichst früh tun? Sie müssen Gefahren ___.", "erkennen"]];document.getElementById('words').innerHTML=words.map(w=>'<span class="word">'+w+'</span>').join('');document.getElementById('questions').innerHTML=items.map((it,i)=>'<li><label>'+it[0].replace('___','<input aria-label="Antwort '+(i+1)+'" id="a'+i+'" autocomplete="off">')+'</label><span class="feedback" id="f'+i+'"></span></li>').join('');function norm(s){return s.trim().toLocaleLowerCase('de').replace(/\s+/g,' ')}function check(){let n=0;items.forEach((it,i)=>{let e=document.getElementById('a'+i),f=document.getElementById('f'+i);let ok=norm(e.value)===norm(it[1]);n+=ok?1:0;e.className=ok?'ok':'bad';f.textContent=ok?'✓':'Richtig: '+it[1]});document.getElementById('result').textContent=n+' von '+items.length+' richtig.'}function resetAll(){items.forEach((_,i)=>{document.getElementById('a'+i).value='';document.getElementById('a'+i).className='';document.getElementById('f'+i).textContent=''});document.getElementById('result').textContent=''}</script></body></html>
